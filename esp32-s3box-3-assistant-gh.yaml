  - platform: aht10
    i2c_id: bus_b
    variant: AHT20
    temperature:
      name: S3 Temperature
      id: s3temp
    humidity:
      name: S3 Humidity
      id: s3humidity
    update_interval: 60s

  - platform: uptime
    id: up_sens
    update_interval: 30s
    on_value:
      - lambda: |-
          int seconds = id(up_sens).state;
          int days = seconds / 86400;
          int hours = seconds / 3600;
          int minutes = (seconds % 3600) / 60;
          seconds %= 60;
          id(up_sens_text).publish_state(str_sprintf("%03d:%02d:%02d:%02d", days, hours, minutes, seconds));

  - platform: wifi_signal
    name: WiFi db
    id: wifi_signal_db
    update_interval: 30s

  - platform: copy
    source_id: wifi_signal_db
    name: WiFi Signal
    id: wifi_percent
    unit_of_measurement: "%"
    entity_category: diagnostic
    device_class: ""
    filters:
      - lambda: return min(max(2 * (x + 100.0f), 0.0f), 100.0f);

text_sensor:
  - id: text_request
    platform: template
    on_value:
      - lambda: |-
          if (id(text_request).state.length() > 44) {
            std::string truncated = esphome::str_truncate(id(text_request).state.c_str(), 41);
            id(text_request).state = (truncated + "...").c_str();
          }

  - id: text_response
    platform: template
    on_value:
      - lambda: |-
          if (id(text_response).state.length() > 44) {
            std::string truncated = esphome::str_truncate(id(text_response).state.c_str(), 41);
            id(text_response).state = (truncated + "...").c_str();
