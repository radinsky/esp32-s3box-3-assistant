          it.filled_rectangle(182, 150 - c, 14, c, id(accent_green));
          if (id(display_conversation).state) {
            it.filled_rectangle(10, 166, 300, 22, id(surface_1));
            it.rectangle(10, 166, 300, 22, id(line));
            it.printf(18, 174, id(font_ui_12), id(text_soft), "%s", id(text_request).state.c_str());
            it.filled_rectangle(10, 194, 300, 30, id(surface_2));
            it.rectangle(10, 194, 300, 30, id(line));
            it.printf(18, 205, id(font_ui_12), id(text_main), "%s", id(text_response).state.c_str());
          }

      - id: assistant_error_page
        lambda: |-
          it.fill(id(ink));
          it.printf(160, 72, id(icon_lg), id(accent_red), TextAlign::CENTER, "\U000F087B");
          it.printf(160, 142, id(font_title_24), id(accent_red), TextAlign::CENTER, "Voice path error");
          it.printf(160, 170, id(font_ui_14), id(text_soft), TextAlign::CENTER, "Check WiFi, HA or the pipeline");

      - id: boot_page
        lambda: |-
          int phase = id(ui_tick) % 3;
          it.fill(id(ink));
          it.printf(160, 74, id(icon_lg), id(accent_blue), TextAlign::CENTER, "\U000F1A12");
          it.printf(160, 146, id(font_title_24), id(text_main), TextAlign::CENTER, "Booting panel");
          it.printf(160, 172, id(font_ui_14), id(text_soft), TextAlign::CENTER, "audio path, wake path and control deck");
          for (int i = 0; i < 3; i++) {
            it.filled_rectangle(118 + (i * 28), 202, 18, 12, i == phase ? id(accent_green) : id(surface_2));
          }

      - id: saver_page
        lambda: |-
          it.fill(Color::BLACK);
          auto now = id(ha_time).now();
          const char *days[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
          const char *months[] = {"January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"};
          if (now.is_valid()) {
            it.printf(160, 18, id(font_title_24), id(text_main), TextAlign::TOP_CENTER, "%s %d %s", days[now.day_of_week - 1], now.day_of_month, months[now.month - 1]);
            if (id(time_display_format).state == "12h") {
              char time_buf[8];
              snprintf(time_buf, sizeof(time_buf), "%02d :%02d", ((now.hour + 11) % 12) + 1, now.minute);
              it.printf(160, 110, id(saver_font_clock), id(text_main), TextAlign::CENTER, "%s", time_buf);
            } else {
              it.strftime(160, 110, id(saver_font_clock), TextAlign::CENTER, "%H :%M", now);
            }
          } else {
            it.printf(160, 18, id(font_title_24), id(text_main), TextAlign::TOP_CENTER, "--");
            it.printf(160, 110, id(saver_font_clock), id(text_main), TextAlign::CENTER, "-- :--");
          }
          it.printf(160, 202, id(saver_font_temp), id(text_soft), TextAlign::CENTER, "%.1fC", id(ac_room_temperature).state);

      - id: ota_page
        lambda: |-
          int phase = id(ui_tick) % 3;
          it.fill(id(ink));
          it.printf(160, 68, id(icon_lg), id(accent_amber), TextAlign::CENTER, "\U000F08D6");
          it.printf(160, 144, id(font_title_24), id(text_main), TextAlign::CENTER, "Applying update");
          it.printf(160, 172, id(font_ui_14), id(text_soft), TextAlign::CENTER, "The touch stack may restart after OTA");
          for (int i = 0; i < 3; i++) {
            it.filled_rectangle(118 + (i * 28), 202, 18, 12, i == phase ? id(accent_amber) : id(surface_2));
          }

i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO18
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 100kHz

  - id: bus_b
    sda: GPIO41
    scl: GPIO40
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 50kHz

touchscreen:
  - platform: gt911
    i2c_id: bus_a
    address: 0x5D
    id: gt911_touchscreen
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    on_touch:
      - script.execute: wake_screen
    on_release:
      - script.execute: schedule_saver

binary_sensor:
  - platform: gpio
    id: top_left_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    on_press:
      - if:
          condition:
            display.is_displaying_page: saver_page
          then:
            - script.execute: show_dashboard
          else:
            - script.execute: manual_saver

  - platform: gt911
    id: home_button
    index: 0
    on_press:
      - lambda: id(home_button_press_time) = millis();
    on_release:
      - lambda: |-
          uint32_t press_duration = millis() - id(home_button_press_time);
          id(is_long_press) = press_duration > 1000;
      - if:
          condition:
            lambda: return id(is_long_press);
          then:
            - voice_assistant.start_continuous:
          else:
            - if:
                condition:
                  display.is_displaying_page: dashboard_page
                then:
                  - script.execute: manual_saver
                else:
                  - voice_assistant.stop
                  - script.execute: show_dashboard

