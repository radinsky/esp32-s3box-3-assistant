# GitHub template version.
# Before first use, update the substitutions below and add the matching
# `wifi_ssid` / `wifi_password` entries to your ESPHome secrets file.
# Unused scene/macro/light slots may stay on the `.none` placeholders.

substitutions:
  name: "esp32-s3box-3-assistant"
  friendly_name: ESP32-S3-Box-3 Assistant

  # Set this to the media_player object_id only, without the `media_player.` prefix.
  external_media_player: living_room_speaker
  climate_entity: climate.your_climate
  alarm_entity: alarm_control_panel.your_alarm
  room_temperature_entity: sensor.your_room_temperature
  last_motion_entity: sensor.last_motion
  # Used for audio URLs sent to external players. Do not leave this as localhost.
  home_assistant_host: http://homeassistant.local:8123
  tts_voice_speed: "24000"

  light_1_label: Light 1
  light_1_entity: light.your_light_1
  light_2_label: Light 2
  light_2_entity: light.none
  light_3_label: Light 3
  light_3_entity: light.none
  light_4_label: Light 4
  light_4_entity: light.none
  light_5_label: Light 5
  light_5_entity: light.none
  light_6_label: Light 6
  light_6_entity: light.none

  scene_1_label: Scene 1
  scene_1_entity: scene.none
  scene_2_label: Scene 2
  scene_2_entity: scene.none
  scene_3_label: Scene 3
  scene_3_entity: scene.none
  scene_4_label: Scene 4
  scene_4_entity: scene.none
  scene_5_label: Scene 5
  scene_5_entity: scene.none
  scene_6_label: Scene 6
  scene_6_entity: scene.none

  macro_1_label: Macro 1
  macro_1_entity: script.none
  macro_2_label: Macro 2
  macro_2_entity: script.none
  macro_3_label: Macro 3
  macro_3_entity: script.none
  macro_4_label: Macro 4
  macro_4_entity: script.none
  macro_5_label: Macro 5
  macro_5_entity: script.none
  macro_6_label: Macro 6
  macro_6_entity: script.none

  wake_word: hey_jarvis

  ui_glyphs: '&@!"''()+=,-_.:°/%?0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz'
  data_glyphs: '0123456789:-.%C'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0
  platformio_options:
    build_flags:
      # GCC 14 warns on std::is_pod in ESPHome's bundled esp-tflite-micro code.
      - -Wno-deprecated-declarations
      # GCC 14 also emits shadow warnings in esp-tflite-micro reference kernels.
      - -Wno-shadow
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(led).turn_on().set_brightness(id(s_default_brightness).state / 100.0f).perform();
          id(wakeword_location).publish_state(
            id(wake_word_engine_location).current_option() == "Cloud relay" ? "Cloud" : "Edge"
          );
          id(time_display_format).publish_state(id(time_format).current_option());
          id(time_remaining_0).publish_state("0:00:00");
          id(current_pin) = "";
          id(pending_alarm_action) = "";
      - display.page.show: boot_page
      - component.update: s3_box_lcd
      - script.execute: schedule_saver
      - if:
          condition:
            switch.is_on: output_audio
          then:
            - media_player.volume_set:
                id: speaker_media_player
                volume: 0
          else:
            - script.execute: set_volume
  project:
    name: "panel.assistant_canvas"
    version: "2026.03.28"

esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

api:
  on_client_connected:
    - lambda: id(api_connection) = true;
    - script.execute: wake_screen
    - component.update: s3_box_lcd
    - script.execute: schedule_saver
  on_client_disconnected:
    - lambda: id(api_connection) = false;
    - component.update: s3_box_lcd

ota:
  - platform: esphome
    on_begin:
      - lambda: |-
          id(led).turn_on().set_brightness(1.0f).set_transition_length(0).perform();
          id(led).loop();
      - display.page.show: ota_page
      - component.update: s3_box_lcd

logger:
  hardware_uart: USB_SERIAL_JTAG
  logs:
    text_sensor: WARN
    component: ERROR

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: s3box123
  on_connect:
    - lambda: id(wifi_connection) = true;
    - switch.turn_on: speaker_enable
    - display.page.show: dashboard_page
    - component.update: s3_box_lcd
  on_disconnect:
    - lambda: id(wifi_connection) = false;
    - component.update: s3_box_lcd

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

interval:
  - interval: 30s
    then:
      - component.update: s3_box_lcd
  - interval: 800ms
    then:
      - lambda: id(ui_tick) += 1;
      - component.update: s3_box_lcd
  - interval: 10s
    then:
      - if:
          condition:
            lambda: return (id(api_connection) != true);
          then:
            - if:
                condition:
                  api.connected:
                then:
                  - lambda: id(api_connection) = true;
          else:
            - if:
                condition:
                  not:
                    api.connected:
                then:
                  - lambda: id(api_connection) = false;
  - interval: 10s
    then:
      - if:
          condition:
            lambda: return (id(wifi_connection) != true);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - lambda: id(wifi_connection) = true;
          else:
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - lambda: id(wifi_connection) = false;

select:
  - platform: template
    entity_category: config
    name: Wake path
    id: wake_word_engine_location
    optimistic: true
    restore_value: true
    options:
      - Cloud relay
      - Edge wake
    initial_option: Edge wake
    on_value:
      - if:
          condition:
            lambda: return x == "Cloud relay";
          then:
            - micro_wake_word.stop
            - delay: 500ms
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
            - text_sensor.template.publish:
                id: wakeword_location
                state: "Cloud"
      - if:
          condition:
            lambda: return x == "Edge wake";
          then:
            - text_sensor.template.publish:
                id: wakeword_location
                state: "Edge"
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop
            - delay: 500ms
            - micro_wake_word.start
      - component.update: s3_box_lcd

  - platform: template
    entity_category: config
    name: Clock mode
    id: time_format
    optimistic: true
    restore_value: true
    options:
      - 12h
      - 24h
    initial_option: 24h
    on_value:
      - text_sensor.template.publish:
          id: time_display_format
          state: !lambda 'return x;'
      - component.update: s3_box_lcd

script:
  - id: wake_screen
    then:
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state / 100.0f).perform();

  - id: show_dashboard
    then:
      - script.execute: wake_screen
      - display.page.show: dashboard_page
      - component.update: s3_box_lcd
      - script.execute: schedule_saver

  - id: start_voice_assistant
    then:
      - if:
          condition:
            switch.is_off: mute_switch
          then:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).current_option() == "Cloud relay";
                then:
                  - lambda: id(va).set_use_wake_word(true);
                  - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).current_option() == "Edge wake";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - micro_wake_word.start

  - id: stop_voice_assistant
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "Cloud relay";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "Edge wake";
          then:
            - voice_assistant.stop
            - micro_wake_word.stop

  - id: set_volume
    then:
      - media_player.volume_set:
          id: speaker_media_player
          volume: !lambda return 0.5f + id(speaker_volume) * 0.05f;

  - id: schedule_saver
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: s_saver
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state / 100.0f).perform();
            - delay: !lambda return id(s_saver_delay).state * 1000;
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state / 100.0f).perform();
            - display.page.show: saver_page
            - component.update: s3_box_lcd
      - if:
          condition:
            switch.is_on: s_saver_mode
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led

  - id: manual_saver
    mode: restart
    then:
      - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state / 100.0f).perform();
      - display.page.show: saver_page
      - component.update: s3_box_lcd
      - if:
          condition:
            switch.is_on: s_saver_mode
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led

  - id: timer_started_external
    then:
      - while:
          condition:
            switch.is_on: timer_ringing
          then:
            - homeassistant.service:
                service: media_player.play_media
                data:
                  entity_id: media_player.${external_media_player}
                  media_content_id: "${home_assistant_host}/local/sounds/timer_finished.mp3"
                  media_content_type: music
            - delay: 1700ms

  - id: timer_ending
    then:
      - wait_until:
          lambda: return id(time_remaining_0).state == "0:00:10";
      - display.page.show: timer_page
      - component.update: s3_box_lcd

  - id: submit_alarm_action
    then:
      - if:
          condition:
            lambda: return id(pending_alarm_action) == "disarm";
          then:
            - homeassistant.service:
                service: alarm_control_panel.alarm_disarm
                data:
                  entity_id: ${alarm_entity}
                  code: !lambda return id(current_pin).c_str();
      - if:
          condition:
            lambda: return id(pending_alarm_action) == "arm_home";
          then:
            - homeassistant.service:
                service: alarm_control_panel.alarm_arm_home
                data:
                  entity_id: ${alarm_entity}
                  code: !lambda return id(current_pin).c_str();
      - if:
          condition:
            lambda: return id(pending_alarm_action) == "arm_away";
          then:
            - homeassistant.service:
                service: alarm_control_panel.alarm_arm_away
                data:
                  entity_id: ${alarm_entity}
                  code: !lambda return id(current_pin).c_str();
      - if:
          condition:
            lambda: return id(pending_alarm_action) == "arm_night";
          then:
            - homeassistant.service:
                service: alarm_control_panel.alarm_arm_night
                data:
                  entity_id: ${alarm_entity}
                  code: !lambda return id(current_pin).c_str();
      - lambda: |-
          id(current_pin) = "";
          id(pending_alarm_action) = "";
      - display.page.show: security_page
      - component.update: s3_box_lcd

  - id: show_notification
    then:
      - script.execute: wake_screen
      - display.page.show: notification_page
      - component.update: s3_box_lcd
      - delay: 8s
      - display.page.show: dashboard_page
      - component.update: s3_box_lcd
      - script.execute: schedule_saver

  - id: light_pref_set_1
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda |-
              if (id(selected_light_slot) == 1) return std::string("${light_1_entity}");
              if (id(selected_light_slot) == 2) return std::string("${light_2_entity}");
              if (id(selected_light_slot) == 3) return std::string("${light_3_entity}");
              if (id(selected_light_slot) == 4) return std::string("${light_4_entity}");
              if (id(selected_light_slot) == 5) return std::string("${light_5_entity}");
              return std::string("${light_6_entity}");
            brightness_pct: "1"
      - component.update: s3_box_lcd

  - id: light_pref_set_25
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda |-
              if (id(selected_light_slot) == 1) return std::string("${light_1_entity}");
              if (id(selected_light_slot) == 2) return std::string("${light_2_entity}");
              if (id(selected_light_slot) == 3) return std::string("${light_3_entity}");
              if (id(selected_light_slot) == 4) return std::string("${light_4_entity}");
              if (id(selected_light_slot) == 5) return std::string("${light_5_entity}");
              return std::string("${light_6_entity}");
            brightness_pct: "25"
      - component.update: s3_box_lcd

  - id: light_pref_set_50
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda |-
              if (id(selected_light_slot) == 1) return std::string("${light_1_entity}");
              if (id(selected_light_slot) == 2) return std::string("${light_2_entity}");
              if (id(selected_light_slot) == 3) return std::string("${light_3_entity}");
              if (id(selected_light_slot) == 4) return std::string("${light_4_entity}");
              if (id(selected_light_slot) == 5) return std::string("${light_5_entity}");
              return std::string("${light_6_entity}");
            brightness_pct: "50"
      - component.update: s3_box_lcd

  - id: light_pref_set_100
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda |-
              if (id(selected_light_slot) == 1) return std::string("${light_1_entity}");
              if (id(selected_light_slot) == 2) return std::string("${light_2_entity}");
              if (id(selected_light_slot) == 3) return std::string("${light_3_entity}");
              if (id(selected_light_slot) == 4) return std::string("${light_4_entity}");
              if (id(selected_light_slot) == 5) return std::string("${light_5_entity}");
              return std::string("${light_6_entity}");
            brightness_pct: "100"
      - component.update: s3_box_lcd

  - id: light_pref_color_orange
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda |-
              if (id(selected_light_slot) == 1) return std::string("${light_1_entity}");
              if (id(selected_light_slot) == 2) return std::string("${light_2_entity}");
              if (id(selected_light_slot) == 3) return std::string("${light_3_entity}");
              if (id(selected_light_slot) == 4) return std::string("${light_4_entity}");
              if (id(selected_light_slot) == 5) return std::string("${light_5_entity}");
              return std::string("${light_6_entity}");
            color_name: "orange"
      - component.update: s3_box_lcd

  - id: light_pref_color_red
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda |-
              if (id(selected_light_slot) == 1) return std::string("${light_1_entity}");
              if (id(selected_light_slot) == 2) return std::string("${light_2_entity}");
              if (id(selected_light_slot) == 3) return std::string("${light_3_entity}");
              if (id(selected_light_slot) == 4) return std::string("${light_4_entity}");
              if (id(selected_light_slot) == 5) return std::string("${light_5_entity}");
              return std::string("${light_6_entity}");
            color_name: "red"
      - component.update: s3_box_lcd

  - id: light_pref_color_purple
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda |-
              if (id(selected_light_slot) == 1) return std::string("${light_1_entity}");
              if (id(selected_light_slot) == 2) return std::string("${light_2_entity}");
              if (id(selected_light_slot) == 3) return std::string("${light_3_entity}");
              if (id(selected_light_slot) == 4) return std::string("${light_4_entity}");
              if (id(selected_light_slot) == 5) return std::string("${light_5_entity}");
              return std::string("${light_6_entity}");
            color_name: "purple"
      - component.update: s3_box_lcd

  - id: light_pref_color_white
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda |-
              if (id(selected_light_slot) == 1) return std::string("${light_1_entity}");
              if (id(selected_light_slot) == 2) return std::string("${light_2_entity}");
              if (id(selected_light_slot) == 3) return std::string("${light_3_entity}");
              if (id(selected_light_slot) == 4) return std::string("${light_4_entity}");
              if (id(selected_light_slot) == 5) return std::string("${light_5_entity}");
              return std::string("${light_6_entity}");
            color_name: "white"
      - component.update: s3_box_lcd

globals:
  - id: wifi_connection
    type: bool
    restore_value: no
    initial_value: "false"
  - id: api_connection
    type: bool
    restore_value: no
    initial_value: "false"
  - id: speaker_volume
    type: int
    restore_value: no
    initial_value: "5"
  - id: media_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: current_pin
    type: std::string
    initial_value: ""
  - id: previous_notification_text
    type: std::string
    initial_value: ""
  - id: home_button_press_time
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: is_long_press
    type: bool
    restore_value: no
    initial_value: "false"
  - id: global_is_assisting
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ui_tick
    type: int
    restore_value: no
    initial_value: "0"
  - id: pending_alarm_action
    type: std::string
    initial_value: ""
  - id: light_press_start
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: selected_light_slot
    type: int
    restore_value: no
    initial_value: "1"

number:
  - id: s_saver_delay
    platform: template
    name: "Idle dim delay"
    icon: mdi:sleep
    entity_category: config
    unit_of_measurement: secs
    optimistic: true
    restore_value: true
    initial_value: 30
    step: 5
    min_value: 10
    max_value: 999999
    on_value:
      - component.update: s3_box_lcd
      - script.execute: schedule_saver

  - id: s_saver_blank_delay
    platform: template
    name: "Idle blank delay"
    icon: mdi:monitor-off
    entity_category: config
    unit_of_measurement: secs
    optimistic: true
    restore_value: true
    initial_value: 30
    step: 5
    min_value: 10
    max_value: 999999
    on_value:
      - component.update: s3_box_lcd
      - script.execute: schedule_saver

  - id: s_saver_brightness
    platform: template
    name: "Idle brightness"
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 30
    step: 5
    min_value: 20
    max_value: 100
    on_value:
      - component.update: s3_box_lcd
      - script.execute: schedule_saver

  - id: s_default_brightness
    platform: template
    name: "Active brightness"
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 100
    step: 5
    min_value: 20
    max_value: 100
    on_value:
      - component.update: s3_box_lcd
      - script.execute: schedule_saver

button:
  - platform: restart
    id: reboot
    name: Reboot
    entity_category: diagnostic

switch:
  - platform: gpio
    name: Speaker enable
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    disabled_by_default: true

  - platform: template
    name: Show transcript
    id: display_conversation
    icon: mdi:chat
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: template
    name: Route audio outward
    id: output_audio
    icon: mdi:cast-audio
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - media_player.volume_set:
          id: speaker_media_player
          volume: 0
      - component.update: s3_box_lcd
    on_turn_off:
      - script.execute: set_volume
      - component.update: s3_box_lcd

  - platform: template
    name: Mute assistant
    id: mute_switch
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - voice_assistant.stop
      - micro_wake_word.stop
      - component.update: s3_box_lcd
    on_turn_off:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_voice_assistant
      - component.update: s3_box_lcd

  - platform: template
    id: media_mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - media_player.volume_set:
          id: speaker_media_player
          volume: 0
      - component.update: s3_box_lcd
    on_turn_off:
      - script.execute: set_volume
      - component.update: s3_box_lcd

  - platform: template
    id: ext_media_mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - homeassistant.service:
          service: media_player.volume_mute
          data:
            entity_id: media_player.${external_media_player}
            is_volume_muted: "true"
      - component.update: s3_box_lcd
    on_turn_off:
      - homeassistant.service:
          service: media_player.volume_mute
          data:
            entity_id: media_player.${external_media_player}
            is_volume_muted: "false"
      - component.update: s3_box_lcd

  - platform: template
    id: s_saver
    name: Idle view enabled
    icon: mdi:sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  - platform: template
    id: s_saver_mode
    name: Blank after idle
    icon: mdi:monitor-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  - platform: template
    id: s_saver_presc
    name: Wake on movement
    icon: mdi:motion-sensor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(va).set_use_wake_word(false);
      - voice_assistant.stop
      - micro_wake_word.stop
      - delay: 150ms
      - lambda: id(led).turn_on().set_brightness(1.0f).perform();
      - lambda: |-
          id(speaker_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
            .set_announcement(true)
            .perform();
          id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished_sound
          announcement: true
      - delay: 15min
      - switch.turn_off: timer_ringing
    on_turn_off:
      - lambda: |-
          id(speaker_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
            .set_announcement(true)
            .perform();
          id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      - media_player.stop:
          announcement: true
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "Edge wake";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start
          else:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start

  - platform: template
    id: wake_sound
    name: Wake earcon
    icon: mdi:music
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: mute_response_switch
    name: Silent replies
    icon: mdi:chat-sleep
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

