display:
  - platform: ili9xxx
    id: s3_box_lcd
    model: S3BOX
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    update_interval: never
    invert_colors: false
    pages:
      - id: dashboard_page
        lambda: |-
          auto format_temp = [&](float value, int decimals = 0) -> std::string {
            if (!(value == value)) return "--";
            return decimals == 0 ? str_sprintf("%.0fC", value) : str_sprintf("%.1fC", value);
          };
          auto motion_age = [&]() -> std::string {
            auto now = id(ha_time).now();
            if (!now.is_valid() || id(last_motion_time).state.length() < 19) return "--";
            std::tm tm = {};
            int year = 0, month = 0, day = 0, hour = 0, minute = 0, second = 0;
            if (sscanf(id(last_motion_time).state.c_str(), "%d-%d-%d %d:%d:%d", &year, &month, &day, &hour, &minute, &second) != 6) return "--";
            tm.tm_year = year - 1900;
            tm.tm_mon = month - 1;
            tm.tm_mday = day;
            tm.tm_hour = hour;
            tm.tm_min = minute;
            tm.tm_sec = second;
            tm.tm_isdst = -1;
            time_t then_ts = mktime(&tm);
            if (then_ts <= 0) return "--";
            time_t diff = now.timestamp - then_ts;
            if (diff < 0) diff = 0;
            if (diff < 60) return str_sprintf("%lds", (long) diff);
            if (diff < 3600) return str_sprintf("%ldm", (long) (diff / 60));
            if (diff < 86400) return str_sprintf("%ldh", (long) (diff / 3600));
            return str_sprintf("%ldd", (long) (diff / 86400));
          };
          std::string motion_place = id(last_motion_where).state.empty() ? "--" : id(last_motion_where).state;
          std::string motion_summary = motion_place + " " + motion_age();
          float room_temp = id(ac_room_temperature).state;
          if (!(room_temp == room_temp)) room_temp = id(ac_current_temperature).state;
          std::string mode_text = id(ac_hvac_mode).state.empty() ? "Off" : id(ac_hvac_mode).state;
          std::string alarm_text = "Disarmed";
          Color alarm_color = id(accent_rose);
          if (id(alarm_status).state == "arming") {
            alarm_text = "Arming";
            alarm_color = id(accent_amber);
          } else if (id(alarm_status).state == "armed_home") {
            alarm_text = "Home";
            alarm_color = id(accent_green);
          } else if (id(alarm_status).state == "armed_away") {
            alarm_text = "Away";
            alarm_color = id(accent_green);
          } else if (id(alarm_status).state == "armed_night") {
            alarm_text = "Night";
            alarm_color = id(accent_violet);
          }
          int lights_on = 0;
          if (id(light_1_state).state == "on") lights_on++;
          if (id(light_2_state).state == "on") lights_on++;
          if (id(light_3_state).state == "on") lights_on++;
          if (id(light_4_state).state == "on") lights_on++;
          if (id(light_5_state).state == "on") lights_on++;
          if (id(light_6_state).state == "on") lights_on++;
          auto card = [&](int x, int y, Color accent, const char *icon, const char *title, const std::string &top_right, const std::string &line_1, const std::string &line_2) {
            it.filled_rectangle(x, y, 136, 102, id(surface_1));
            it.filled_rectangle(x, y, 4, 102, accent);
            it.printf(x + 18, y + 12, id(font_ui_18), id(text_main), TextAlign::TOP_LEFT, "%s", title);
            it.printf(x + 120, y + 12, id(icon_xs), accent, TextAlign::TOP_RIGHT, "%s", icon);
            if (!top_right.empty()) it.printf(x + 120, y + 40, id(font_ui_12), accent, TextAlign::TOP_RIGHT, "%s", top_right.c_str());
            if (!line_1.empty()) it.printf(x + 18, y + 52, id(font_ui_18), id(text_main), TextAlign::TOP_LEFT, "%s", line_1.c_str());
            if (!line_2.empty()) it.printf(x + 18, y + 74, id(font_ui_12), id(text_soft), TextAlign::TOP_LEFT, "%s", line_2.c_str());
          };
          it.fill(id(ink));
          card(14, 14, id(accent_blue), "\U000F0717", "Climate", format_temp(room_temp), mode_text, str_sprintf("Target %s", format_temp(id(ac_target_temperature).state).c_str()));
          it.filled_rectangle(170, 14, 136, 102, id(surface_1));
